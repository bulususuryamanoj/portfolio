<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hackathon Details | Surya Manoj</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1 class="logo">Surya Manoj</h1>
    <nav>
        <a href="index.html#hackathons">Home</a>
        <button class="btn secondary" onclick="goBack()">✕ Close</button>
    </nav>
</header>

<section class="project-details">
    <div class="project-card">

        <!-- HEADER -->
        <div class="hack-header">
            <img id="headerImage" alt="Hackathon Logo">
            <h3 id="title"></h3>
        </div>

        <!-- DESCRIPTION -->
        <p id="desc1"></p>
        <p id="desc2"></p>

        <!-- IMAGES + CERTIFICATE -->
        <div class="hackathon-layout">
            <div class="hackathon-gallery" id="image-container"></div>

            <div class="hackathon-certificate">
                <h4>Certificate</h4>
                <img id="certificate" alt="Certificate">
            </div>
        </div>

    </div>
    <!-- ===== IMAGE LIGHTBOX ===== -->
<div id="imgLightbox" class="img-lightbox">
    <span class="img-close">&times;</span>
    <img class="img-lightbox-content" id="lightboxImg">
</div>

</section>

<footer>
    <p>© 2026 Surya Manoj | Data Science Portfolio</p>
</footer>

<script>
const hackathons = {
    android: {
        title: "Android Hackathon",
        header: "bootcamp and hackathons/Android-app-development.jpg",
        images: [],
        desc1: "Participated in an Android Hackathon focused on building real-world mobile application solutions.",
        desc2: "Worked on UI/UX planning, feature implementation, and final presentation.",
        certificate: "bootcamp and hackathons/android-hackcthon.jpg"
    },
    devops: {
        title: "DevOps Hackathon",
        header: "bootcamp and hackathons/devops.jpg",
        images: ["bootcamp and hackathons/devopscertimg.jpg"],
        desc1: "Focused on CI/CD pipelines, automation, and deployment workflows.",
        desc2: "Collaborated on infrastructure optimization and DevOps practices.",
        certificate: "bootcamp and hackathons/devopscert.jpg"
    },
    eda: {
        title: "EDA Hackathon – First Prize 🏆",
        header: "bootcamp and hackathons/eda.jpg",
        images: ["bootcamp and hackathons/prize.jpg"],
        desc1: "Won first prize by performing in-depth exploratory data analysis.",
        desc2: "Delivered meaningful insights through visualization and statistics.",
        certificate: "bootcamp and hackathons/EDA-CERTIFICATE.jpg"
    }
};

const type = new URLSearchParams(window.location.search).get("type");
const data = hackathons[type] || hackathons.android;

document.getElementById("title").innerText = data.title;
document.getElementById("headerImage").src = data.header;
document.getElementById("desc1").innerText = data.desc1;
document.getElementById("desc2").innerText = data.desc2;
document.getElementById("certificate").src = data.certificate;

const container = document.getElementById("image-container");
data.images.forEach(src => {
    const img = document.createElement("img");
    img.src = src;
    container.appendChild(img);
});

function goBack() {
    window.location.href = "index.html#hackathons";
}
// ===== IMAGE LIGHTBOX SCRIPT =====
const lightbox = document.getElementById("imgLightbox");
const lightboxImg = document.getElementById("lightboxImg");
const closeBtn = document.querySelector(".img-close");

// Open lightbox when any gallery/certificate image is clicked
document.addEventListener("click", function(e) {
    if (e.target.tagName === "IMG" && 
       (e.target.closest(".hackathon-gallery") || e.target.closest(".hackathon-certificate"))) {
        
        lightbox.style.display = "flex";
        lightboxImg.src = e.target.src;
        document.body.style.overflow = "hidden";
    }
});

// Close on X click
closeBtn.onclick = function() {
    lightbox.style.display = "none";
    document.body.style.overflow = "auto";
};

// Close on background click
lightbox.onclick = function(e) {
    if (e.target === lightbox) {
        lightbox.style.display = "none";
        document.body.style.overflow = "auto";
    }
};

</script>

</body>
</html>
